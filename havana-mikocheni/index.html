
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>Havana Properties - Immersive Experience</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #111;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 420px;
        overflow: hidden;
        background: #111;
      }

      /* `dvh` follows the visible mobile viewport as browser controls appear. */
      @supports (height: 100dvh) {
        .experience { height: 100dvh; }
      }

      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="experience">
      <iframe
        title="Land Plot Experience"
        src="https://pano.cool/@code255techZVuto60w/havana-mikocheni?embed&amp;fullscreen=true"
        loading="lazy"
        allow="xr; fullscreen"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
